<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>ガソリン料金計算アプリ</title>

    <!-- スマホ表示用（画面幅に合わせる） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        .container {
            max-width: 480px;          /* スマホでも見やすい幅 */
            margin: 16px auto;
            padding: 16px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 1.4rem;
            margin-top: 0;
            text-align: center;
        }

        .unit {
            font-size: 0.95rem;
            margin-bottom: 12px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 0.95rem;
        }

        input[type="number"] {
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            background: #0078d4;
            color: #fff;
        }

        button:active {
            transform: translateY(1px);
        }

        .result {
            margin-top: 16px;
            padding: 12px;
            background: #e6f4ff;
            border-radius: 6px;
        }

        .result p {
            margin: 4px 0;
        }

        .result strong {
            font-size: 1.2rem;
        }

        .error {
            margin-top: 8px;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 6px;
            background: #ffe6e6;
            color: #b00020;
            font-size: 0.9rem;
        }

        .note {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>ガソリン料金計算</h1>

    <p class="unit">
        現在の参考単価：<strong>{{ unit_price }}</strong> 円 / L
    </p>

    {% if error_message %}
        <div class="error">
            {{ error_message }}
        </div>
    {% endif %}

    <form method="post" action="/calculate">
        <label for="liters">給油量（L）を入力してください：</label>
        <input
            type="number"
            id="liters"
            name="liters"
            step="0.1"
            min="0"
            placeholder="例：35.5"
            value="{% if liters is not none %}{{ liters }}{% endif %}"
        >
        <button type="submit">金額を計算する</button>
    </form>

    {% if total_price is not none %}
        <div class="result">
            <p>給油量：{{ liters }} L</p>
            <p>請求金額：<strong>{{ total_price }} 円</strong></p>
        </div>
    {% endif %}

    <p class="note">
        ※ 単価はサンプル値です。実際のスタンド価格とは異なる場合があります。
    </p>
</div>
</body>
</html>
